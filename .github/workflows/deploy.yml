name: Build & Release

on:
  push:
    branches: [ main ]

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Allow creating GitHub Releases and uploading assets
permissions:
  contents: write

jobs:
  test:
    name: Tests & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Cache Robolectric SDK dependencies so they aren't downloaded from scratch on every run
      - name: Cache Robolectric SDKs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Run Core Tests
        run: ./gradlew :core:test --no-daemon

      # JavaFX requires a virtual display (Xvfb) on headless Linux CI
      - name: Run Desktop Tests (Headless Xvfb)
        run: xvfb-run --auto-servernum ./gradlew :desktop:test --no-daemon

      - name: Run Android Unit Tests
        run: ./gradlew :android:testDebugUnitTest --no-daemon

  desktop:
    name: Desktop on ${{ matrix.os }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash scripts/package.sh
            artifact_glob: desktop/build/installer/*.deb
            artifact_name: BanRoulette-linux.deb

          - os: macos-latest
            script: bash scripts/package.sh
            artifact_glob: desktop/build/installer/*.pkg
            artifact_name: BanRoulette-macos.pkg

          - os: windows-latest
            script: pwsh scripts/package.ps1
            artifact_glob: desktop/build/installer/*.exe
            artifact_name: BanRoulette-windows.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Stage jpackage-input/ (unit tests already passed in the test job)
      - name: Assemble desktop package inputs
        run: ./gradlew :desktop:assemble -x test --no-daemon

      # Run the platform packaging script
      - name: Package installer
        run: ${{ matrix.script }}

      # Give each artifact a stable, OS-specific name for the release
      - name: Rename artifact
        shell: bash
        run: |
          src=$(find desktop/build/installer -maxdepth 1 \
                  \( -name "*.deb" -o -name "*.pkg" -o -name "*.exe" \) \
                  | head -n 1)
          cp "$src" "${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  android:
    name: Android APK
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :android:assembleRelease \
            -PversionCode=${{ github.run_number }} \
            --no-daemon

      - name: Rename APK for release
        shell: bash
        run: |
          cp android/build/outputs/apk/release/android-release.apk BanRoulette.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BanRoulette.apk
          path: BanRoulette.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [test, desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project version from desktop/build.gradle.kts
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -m 1 'version = ' desktop/build.gradle.kts | sed -E 's/.*version = "(.*)".*/\1/' | tr -d '[:space:]')
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers/
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "Ban Roulette v${{ steps.get_version.outputs.VERSION }}"
          body: |
            Release of **Ban Roulette v${{ steps.get_version.outputs.VERSION }}**.
            Commit: `${{ github.sha }}`

            ### Downloads & Installers
            - **macOS**: `BanRoulette-macos.pkg`
            - **Windows**: `BanRoulette-windows.exe`
            - **Linux**: `BanRoulette-linux.deb`
            - **Android**: `BanRoulette.apk`

            > ⚠️ **Unsigned installers** – macOS Gatekeeper, Windows SmartScreen, and Android
            > will display safety warnings on first launch.
          files: installers/*
          generate_release_notes: false
