<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="120" height="200">
  <!--
    Ban Roulette — Ban Hammer (flat SVG, no gradients/filters so JavaFX SVGPath can render it)
    Loaded by com.example.svg.HammerLoader in Step 6.
    Pivot point for the hit animation: centre-bottom of the handle (60, 200).
  -->

  <!-- Handle -->
  <rect x="50" y="90" width="20" height="105" rx="5" ry="5" fill="#6B3A1F"/>
  <!-- Handle wrap / grip tape -->
  <rect x="50" y="140" width="20" height="16" rx="3" ry="3" fill="#4A2810"/>
  <rect x="50" y="162" width="20" height="10" rx="3" ry="3" fill="#4A2810"/>

  <!-- Hammer head body -->
  <rect x="10" y="10" width="100" height="86" rx="10" ry="10" fill="#3B3B3B"/>

  <!-- Hammer head top highlight -->
  <rect x="10" y="10" width="100" height="18" rx="10" ry="10" fill="#555555"/>
  <!-- Left face -->
  <rect x="10" y="10" width="18" height="86" rx="10" ry="10" fill="#2A2A2A"/>
  <!-- Right face -->
  <rect x="92" y="10" width="18" height="86" rx="10" ry="10" fill="#2A2A2A"/>

  <!-- Strike face (bottom of head) -->
  <rect x="14" y="78" width="92" height="16" rx="4" ry="4" fill="#222222"/>

  <!-- Decorative ban symbol on the head -->
  <circle cx="60" cy="52" r="22" fill="none" stroke="#EF4444" stroke-width="5"/>
  <line x1="43" y1="35" x2="77" y2="69" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
</svg>
